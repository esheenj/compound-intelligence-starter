name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Original demo smoke run
        run: python -m src.compound_intelligence.demo --workspace ./local-data --iterations 3
      - name: v0.2 bounded runner smoke and recovery
        run: |
          python -m src.compound_intelligence.runner --input examples/experiments.json
          python -m src.compound_intelligence.runner --input examples/experiments.json
      - name: v0.3 fixture multi-model comparison and replay
        run: |
          python -m src.compound_intelligence.tournament --fixture
          python -m src.compound_intelligence.tournament --fixture
      - name: v0.4 practical challenge fixture and replay
        run: |
          python -m src.compound_intelligence.problem_runner --fixture
          python -m src.compound_intelligence.problem_runner --fixture
      - name: v0.5 measurable benchmark and replay
        run: |
          python -m src.compound_intelligence.benchmark --fixture --output local-data/benchmark.json
          python -m src.compound_intelligence.benchmark --fixture --output local-data/benchmark.json
      - name: v0.6 queue receipt and bounded replay
        run: |
          python -m src.compound_intelligence.scheduler enqueue --id ci-test
          python -m src.compound_intelligence.scheduler tick
          python -m src.compound_intelligence.scheduler tick
          python -m src.compound_intelligence.scheduler status
      - name: v0.7 offline evidence dashboard smoke test
        run: |
          python -m src.compound_intelligence.dashboard --queue-db local-data/v06/queue.sqlite3 --output local-data/dashboard.html
          python -c "from pathlib import Path; assert 'Compound Intelligence' in Path('local-data/dashboard.html').read_text()"
      - name: v0.9 evidence receipt and compatible replay comparison
        run: |
          python -m src.compound_intelligence.progress receipt --report local-data/benchmark.json --run-id 123 --output local-data/cycle-receipt.json
          python -m src.compound_intelligence.progress compare --before local-data/benchmark.json --after local-data/benchmark.json --output local-data/progress.json
