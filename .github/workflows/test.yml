name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Cryptographic challenge and durable replay tests (Node.js built-in crypto)
        run: |
          node --version
          node --test tests/test_agent_auth.mjs
      - name: Stage standalone seven-repo public directory
        run: |
          mkdir -p dist
          python scripts/stage_showcase.py --output dist/pages
      - name: Original demo smoke run
        run: python -m src.compound_intelligence.demo --workspace ./local-data --iterations 3
      - name: v0.2 bounded runner smoke and recovery
        run: |
          python -m src.compound_intelligence.runner --input examples/experiments.json
          python -m src.compound_intelligence.runner --input examples/experiments.json
      - name: v0.3 fixture multi-model comparison and replay
        run: |
          python -m src.compound_intelligence.tournament --fixture
          python -m src.compound_intelligence.tournament --fixture
      - name: v0.4 practical challenge fixture and replay
        run: |
          python -m src.compound_intelligence.problem_runner --fixture
          python -m src.compound_intelligence.problem_runner --fixture
      - name: v0.5 measurable benchmark and replay
        run: |
          python -m src.compound_intelligence.benchmark --fixture --output local-data/benchmark.json
          python -m src.compound_intelligence.benchmark --fixture --output local-data/benchmark.json
      - name: v0.6 queue receipt and bounded replay
        run: |
          python -m src.compound_intelligence.scheduler enqueue --id ci-test
          python -m src.compound_intelligence.scheduler tick
          python -m src.compound_intelligence.scheduler tick
          python -m src.compound_intelligence.scheduler status
      - name: v0.7 offline evidence dashboard smoke test
        run: |
          python -m src.compound_intelligence.dashboard --queue-db local-data/v06/queue.sqlite3 --output local-data/dashboard.html
          python -c "from pathlib import Path; assert 'Compound Intelligence' in Path('local-data/dashboard.html').read_text()"
      - name: v0.9 evidence receipt and compatible replay comparison
        run: |
          python -m src.compound_intelligence.progress receipt --report local-data/benchmark.json --run-id 123 --output local-data/cycle-receipt.json
          python -m src.compound_intelligence.progress compare --before local-data/benchmark.json --after local-data/benchmark.json --output local-data/progress.json
      - name: v1.0 verified memory retrieval and receipt replay
        run: |
          python -m src.compound_intelligence.learning_loop --fixture
          python -m src.compound_intelligence.learning_loop --fixture
      - name: v1.1 paired held-out baseline and assisted evaluation
        run: |
          python -m src.compound_intelligence.ab_evaluation --fixture
          python -m src.compound_intelligence.ab_evaluation --fixture
      - name: Engineering issue challenger (synthetic, no network)
        run: |
          python -m src.compound_intelligence.issue_challenger --input examples/engineering_issues.json > local-data/issue-brief.json
          python -c "import json; x=json.load(open('local-data/issue-brief.json')); assert x['schema'] == 'compound-engineering-challenger-v1' and not x['external_execution'] and len(x['ranked_issues']) == 2"
      - name: Render a safe offline engineering issue report
        run: |
          python -m src.compound_intelligence.issue_report --input examples/engineering_issues.json --output local-data/issue-report.html
          python -m src.compound_intelligence.issue_report --input local-data/issue-brief.json --output local-data/issue-report-from-brief.html
          python -c "from pathlib import Path; a=Path('local-data/issue-report.html').read_bytes(); b=Path('local-data/issue-report-from-brief.html').read_bytes(); assert a == b and b'No experiments, code builds, pull requests' in a and b'<script' not in a"

  browser-smoke:
    name: Real Chrome keyboard and responsive report QA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record actual Chrome and ChromeDriver versions
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - name: Test rendered report with real headless Chrome
        run: python tests/browser_check_issue_report.py
      - name: Test offline hypothesis explorer with real headless Chrome
        run: python tests/browser_check_issue_explorer.py
      - name: Test exact public OSS directory in real headless Chrome
        run: python tests/browser_check_showcase.py
