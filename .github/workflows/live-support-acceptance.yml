name: Post-publish support destination acceptance
on:
  workflow_run:
    workflows: ['Publish CI-verified public OSS directory']
    types: [completed]
permissions:
  contents: read
jobs:
  verify-deployed-support:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read-only Chrome check against public Pages and reviewed manifest
        run: python3 tests/live_support_page_acceptance.py
