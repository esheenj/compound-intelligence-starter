name: Publish CI-verified public OSS directory
on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: compound-public-oss-directory
  cancel-in-progress: false
jobs:
  pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify current main equals the CI-passed source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || {
            echo "::error::Skipping stale source: newer main exists.";
            exit 1;
          }
      - name: Require pre-enabled GitHub Pages with Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/pages-status.json \
            --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [[ "$code" != '200' ]]; then
            echo "::error::Pages not configured (HTTP $code). Enable Settings > Pages > GitHub Actions once."
            exit 1
          fi
          test "$(jq -r '.build_type // "unknown"' /tmp/pages-status.json)" = 'workflow' || {
            echo "::error::Pages source must be GitHub Actions.";
            exit 1;
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage only original public directory HTML
        run: |
          mkdir -p dist
          python scripts/stage_showcase.py --output dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Publish static directory only
        id: deployment
        uses: actions/deploy-pages@v4
