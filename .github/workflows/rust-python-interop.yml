name: Rust-Python parity qualification (experimental)
on:
  pull_request:
    paths:
      - 'experiments/rust_python_interop/**'
      - '.github/workflows/rust-python-interop.yml'
  push:
    paths:
      - 'experiments/rust_python_interop/**'
      - '.github/workflows/rust-python-interop.yml'
permissions:
  contents: read

jobs:
  parity:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.12'
    defaults:
      run:
        working-directory: experiments/rust_python_interop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Report pinned environment
        run: |
          rustc --version
          cargo --version
          python --version
          uname -m
      - name: Resolve experimental dependencies and validate Rust
        run: |
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build native Python extension for this runner only
        run: |
          python -m pip install "maturin>=1.9,<2"
          maturin build --release --out dist --interpreter python --compatibility off
          python -m pip install --no-index --find-links dist rust-id-interop-pilot
      - name: Python-Rust exact parity
        run: python -m unittest discover -s tests -v
      - name: Preserve generated dependency lock for release follow-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-lock-${{ matrix.os }}-${{ matrix.python }}
          path: experiments/rust_python_interop/Cargo.lock
          if-no-files-found: ignore
          retention-days: 3
