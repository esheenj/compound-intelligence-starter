name: Runner Preflight Rust qualification
on:
  pull_request:
    paths:
      - 'experiments/runner_preflight/**'
      - 'scripts/collect_linux_runner.py'
      - 'tests/test_runner_preflight_collector.py'
      - 'site/runner-preflight.html'
      - 'tests/test_runner_preflight_ui.mjs'
      - '.github/workflows/runner-preflight-rust.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/runner_preflight/**'
      - 'scripts/collect_linux_runner.py'
      - 'tests/test_runner_preflight_collector.py'
      - 'site/runner-preflight.html'
      - 'tests/test_runner_preflight_ui.mjs'
      - '.github/workflows/runner-preflight-rust.yml'
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/runner_preflight/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust version and runner identity
        run: |
          rustc --version
          cargo --version
          uname -m
      - name: Validate committed locked source
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Binary and deterministic smoke cases
        run: |
          cargo build --release --locked
          ./target/release/runner-preflight inspect --input ../fixtures/ready-x64.json --format json | grep -q '"status":"READY"'
          set +e
          ./target/release/runner-preflight inspect --input ../fixtures/warn-disk.json --format json > /tmp/runner-preflight-warn.json
          warning=$?
          ./target/release/runner-preflight inspect --input ../fixtures/hold-arch.json --format json > /tmp/runner-preflight-hold.json
          holding=$?
          set -e
          test "$warning" -eq 1
          test "$holding" -eq 2
          grep -q '"status":"WARN"' /tmp/runner-preflight-warn.json
          grep -q '"status":"HOLD"' /tmp/runner-preflight-hold.json

      - name: Browser reference versus compiled Rust parity
        run: |
          cd ../../..
          RUNNER_PREFLIGHT_BINARY=experiments/runner_preflight/rust/target/release/runner-preflight node --test tests/test_runner_preflight_ui.mjs

      - name: Verify Linux observation and exact Rust CLI compatibility
        run: |
          cd ../../..
          python3 -m unittest tests.test_runner_preflight_collector -v
          case "$(uname -m)" in
            aarch64|arm64) job=experiments/runner_preflight/fixtures/job-linux-arm64.json ;;
            x86_64|amd64) job=experiments/runner_preflight/fixtures/job-linux-x64.json ;;
            *) echo 'Unsupported CI architecture' >&2; exit 1 ;;
          esac
          python3 scripts/collect_linux_runner.py --job "$job" --workspace "$GITHUB_WORKSPACE" > /tmp/runner-inventory.json
          experiments/runner_preflight/rust/target/release/runner-preflight inspect --input /tmp/runner-inventory.json --format json | grep -q '"status":"READY"'

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Review RustSec advisories, crate licences, and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: experiments/runner_preflight/rust/Cargo.toml
          command: check
          arguments: --all-features
