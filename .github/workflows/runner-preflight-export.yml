name: Runner Preflight standalone source export
on:
  pull_request:
    paths:
      - 'experiments/runner_preflight/**'
      - 'experiments/runner_preflight/RELEASE_NOTES.md'
      - 'scripts/export_runner_preflight.py'
      - 'scripts/collect_linux_runner.py'
      - 'tests/test_runner_preflight_collector.py'
      - 'tests/test_runner_preflight_export.py'
      - '.github/workflows/runner-preflight-export.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/runner_preflight/**'
      - 'experiments/runner_preflight/RELEASE_NOTES.md'
      - 'scripts/export_runner_preflight.py'
      - 'scripts/collect_linux_runner.py'
      - 'tests/test_runner_preflight_collector.py'
      - 'tests/test_runner_preflight_export.py'
      - '.github/workflows/runner-preflight-export.yml'
permissions:
  contents: read
jobs:
  clean-export:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate deterministic allowlisted export
        run: python3 -m unittest tests.test_runner_preflight_export -v
      - name: Produce public standalone source package
        run: python3 scripts/export_runner_preflight.py --output dist/export --source-revision "$GITHUB_SHA"
      - name: Verify archive digest and extract
        run: |
          cd dist/export
          sha256sum --check runner-preflight-source.zip.sha256
          mkdir -p ../extracted
          unzip -q runner-preflight-source.zip -d ../extracted
      - name: Validate the extracted standalone Rust project
        working-directory: dist/extracted/runner-preflight/rust
        run: |
          rustc --version
          cargo --version
          uname -m
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Test extracted Linux observer against extracted Rust binary
        working-directory: dist/extracted/runner-preflight
        run: |
          python3 -m unittest discover -s tests -p test_runner_preflight_collector.py -v
          case "$(uname -m)" in
            aarch64|arm64) job=fixtures/job-linux-arm64.json ;;
            x86_64|amd64) job=fixtures/job-linux-x64.json ;;
            *) echo 'Unsupported CI architecture' >&2; exit 1 ;;
          esac
          python3 scripts/collect_linux_runner.py --job "$job" --workspace "$GITHUB_WORKSPACE" > /tmp/runner-observed.json
          ./rust/target/release/runner-preflight inspect --input /tmp/runner-observed.json --format json | grep -q '"status":"READY"'
      - name: Smoke test extracted CLI and exit codes
        working-directory: dist/extracted/runner-preflight/rust
        run: |
          ./target/release/runner-preflight inspect --input ../fixtures/ready-x64.json --format json | grep -q '"status":"READY"'
          set +e
          ./target/release/runner-preflight inspect --input ../fixtures/warn-disk.json --format json > /tmp/rp-warning.json
          warned=$?
          ./target/release/runner-preflight inspect --input ../fixtures/hold-arch.json --format json > /tmp/rp-holding.json
          held=$?
          set -e
          test "$warned" -eq 1
          test "$held" -eq 2
          grep -q '"status":"WARN"' /tmp/rp-warning.json
          grep -q '"status":"HOLD"' /tmp/rp-holding.json
      - name: Assemble binary and source build receipts
        run: |
          mkdir -p dist/publish
          cp dist/export/runner-preflight-source.zip dist/publish/
          cp dist/export/runner-preflight-source.zip.sha256 dist/publish/
          cp dist/extracted/runner-preflight/rust/target/release/runner-preflight dist/publish/runner-preflight
          (cd dist/publish && sha256sum runner-preflight > runner-preflight.sha256)
          {
            echo "Build source: $GITHUB_SHA"
            echo "GitHub runner: $RUNNER_OS/$RUNNER_ARCH"
            rustc --version
            cargo --version
          } > dist/publish/BUILD_INFO.txt
      - name: Upload architecture-specific tested distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-preflight-${{ matrix.runner }}-${{ github.run_id }}
          path: dist/publish/
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify RustSec advisories, dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: experiments/runner_preflight/rust/Cargo.toml
          arguments: --all-features
          command: check

  package-preview:
    needs: [clean-export, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download verified Linux x86-64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runner-preflight-ubuntu-24.04-${{ github.run_id }}
          path: dist/download/x86_64
      - name: Download verified Linux ARM64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runner-preflight-ubuntu-24.04-arm-${{ github.run_id }}
          path: dist/download/aarch64
      - name: Confirm exact-commit provenance, cross-arch source parity, checksums and executables
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for arch in x86_64 aarch64; do
            ( cd "dist/download/$arch" && sha256sum --check runner-preflight-source.zip.sha256 && sha256sum --check runner-preflight.sha256 )
            test -s "dist/download/$arch/BUILD_INFO.txt"
            grep -F -- "$GITHUB_SHA" "dist/download/$arch/BUILD_INFO.txt" >/dev/null
          done
          cmp dist/download/x86_64/runner-preflight-source.zip dist/download/aarch64/runner-preflight-source.zip
          python3 - <<'PY'
          import json, os, zipfile
          p = 'dist/download/x86_64/runner-preflight-source.zip'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert 'runner-preflight/SOURCE_PROVENANCE.json' in names
              provenance = json.loads(z.read('runner-preflight/SOURCE_PROVENANCE.json'))
              assert provenance['source_commit'] == os.environ['GITHUB_SHA']
              assert provenance['schema'] == 'runner-preflight-clean-export-v1'
              assert not any(n.startswith('runner-preflight/.git/') for n in names)
          PY
          mkdir -p dist/release
          install -m 0755 dist/download/x86_64/runner-preflight dist/release/runner-preflight-linux-x86_64
          install -m 0755 dist/download/aarch64/runner-preflight dist/release/runner-preflight-linux-aarch64
          cp dist/download/x86_64/runner-preflight-source.zip dist/release/runner-preflight-source.zip
          ( cd dist/release && sha256sum runner-preflight-source.zip runner-preflight-linux-x86_64 runner-preflight-linux-aarch64 > SHA256SUMS )
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Linux x86-64 build:"
            cat dist/download/x86_64/BUILD_INFO.txt
            echo "Linux ARM64 build:"
            cat dist/download/aarch64/BUILD_INFO.txt
          } > dist/release/BUILD_INFO.txt
          ( cd dist/release && sha256sum --check SHA256SUMS )
      - name: Upload validated versioned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-preflight-release-candidate-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    needs: [package-preview]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'esheenj/compound-intelligence-starter' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: runner-preflight-v0.2.0-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download only the validated release-candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runner-preflight-release-candidate-${{ github.run_id }}
          path: dist/release
      - name: Verify checksum manifest before publishing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ( cd dist/release && sha256sum --check SHA256SUMS )
          test -s dist/release/BUILD_INFO.txt
          grep -F -- "$GITHUB_SHA" dist/release/BUILD_INFO.txt >/dev/null
      - name: Publish component-prefixed versioned preview without replacing the starter release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=runner-preflight-v0.2.0
          if gh release view "$tag" >/dev/null 2>&1; then
            actual="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
            for needed in BUILD_INFO.txt SHA256SUMS runner-preflight-source.zip runner-preflight-linux-x86_64 runner-preflight-linux-aarch64; do
              if ! grep -Fxq "$needed" <<< "$actual"; then
                echo "::error::Existing release lacks $needed; HOLD for original-release reconciliation."
                exit 1
              fi
            done
            echo 'Existing complete Runner Preflight preview retained; no mutation performed.'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo '::error::The target tag exists without a release. HOLD; do not recreate or move it.'
            exit 1
          fi
          gh release create "$tag" \
            dist/release/runner-preflight-source.zip \
            dist/release/runner-preflight-linux-x86_64 \
            dist/release/runner-preflight-linux-aarch64 \
            dist/release/SHA256SUMS \
            dist/release/BUILD_INFO.txt \
            --target "$GITHUB_SHA" \
            --title 'Runner Preflight v0.2.0 — Linux preview' \
            --notes-file experiments/runner_preflight/RELEASE_NOTES.md \
            --latest=false --prerelease
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName,assets
