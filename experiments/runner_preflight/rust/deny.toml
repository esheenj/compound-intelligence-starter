# Public Rust CLI source release criteria. Reviewed dependency sources and licenses.
# An advisory scan checks the currently available RustSec database at CI time.
[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
