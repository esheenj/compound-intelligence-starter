# Explicit, narrowly scoped, original research crate policy.
# Every dependency license must match an allowed SPDX expression.
# Do not ignore RustSec advisories or accept unknown package sources.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
